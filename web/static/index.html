<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101013">
<title>포트폴리오</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>포트폴리오</h1>
  <div class="seg" id="cur">
    <button data-cur="krw" class="on">원</button>
    <button data-cur="usd">$</button>
  </div>
</header>

<main id="body">
  <p class="muted" id="status">불러오는 중…</p>
</main>

<template id="tpl-account">
  <section class="hero">
    <div class="row">
      <span class="label">총자산</span>
      <span class="acct"></span>
    </div>
    <div class="total mono"></div>
    <div class="today mono"></div>
    <div class="pnl mono"></div>
    <div class="chips">
      <span class="chip">평가금액 <b class="mono ev"></b></span>
      <span class="chip">예수금 <b class="mono cash"></b></span>
      <span class="chip">환율 <b class="mono rate"></b></span>
    </div>
  </section>

  <div class="pie-wrap"><div class="pie"></div></div>
  <section class="holdings"></section>
</template>

<template id="tpl-holding">
  <article class="hold">
    <div class="r1">
      <span class="dot"></span>
      <span class="name"></span>
      <span class="eval mono"></span>
    </div>
    <div class="r2">
      <span class="qty"></span>
      <span class="gain mono"></span>
      <span class="sep">|</span>
      <span class="rate mono"></span>
    </div>
  </article>
</template>

<footer>
  <span id="stamp" class="muted"></span>
  <button id="reload">새로고침</button>
</footer>
<script src="app.js"></script>
</body>
</html>
