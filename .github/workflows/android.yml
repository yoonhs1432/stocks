name: Android Build

# 수동 빌드 전용 — 요청 시에만 실행. (자동 push 트리거 제거: Actions 사용량/저장 용량 절약)
#
# publish=false 로 돌리면 **빌드만 검증**하고 릴리스는 건드리지 않는다.
# 평소 커밋은 이걸로 컴파일만 확인하고, 실제 게시는 요청이 있을 때 publish=true 로 돌린다.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "android-latest 릴리스에 APK 게시 (끄면 빌드 검증만)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      # 토스증권 연동판 — android/ 를 복사해 만든 별도 앱 (applicationId 가 달라 나란히 설치 가능)
      - name: Build debug APK (toss)
        working-directory: android-toss
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp android-toss/app/build/outputs/apk/debug/app-debug.apk quant-toss-debug.apk

      # (아티팩트 업로드 제거 — Actions 저장 용량 절약. APK는 아래 릴리스로만 게시)

      - name: Publish to rolling release
        # main 병합 후 기준 브랜치가 main으로 바뀜 (이전: claude/android-native)
        if: github.ref == 'refs/heads/main' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Android 최신 빌드 (debug)"
          prerelease: true
          files: |
            app-debug.apk
            quant-toss-debug.apk
          body: |
            갤럭시에서 이 APK를 받아 설치하세요 (출처 불명 앱 설치 허용 필요).

            - `app-debug.apk` — 기존 앱 (퀀트 대시보드)
            - `quant-toss-debug.apk` — 토스증권 연동판 (별도 앱으로 나란히 설치됨)
