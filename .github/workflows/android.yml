name: Android Build

# 수동 빌드 전용 — 요청 시에만 실행.
#
# 집 PC 의 자체 호스팅 러너(HSYUNPC-stocks)에서 돈다. 2026-10-17 부터는 윈도 서비스
# (C:\gh-runners\stocks)라 로그인하지 않아도 뜬다. JDK 17 · Android SDK · Gradle 8.9 는 PC 에
# 이미 깔려 있다(C:\Users\yoonh\android-build). 그래서 설치 단계가 없고, Gradle 캐시가 남아 빌드가 빠르다.
#
# publish=false 로 돌리면 **빌드만 검증**하고 릴리스는 건드리지 않는다.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "android-latest 릴리스에 APK 게시 (끄면 빌드 검증만)"
        type: boolean
        default: true
      notes:
        description: "릴리스 노트 (비우면 최근 커밋 목록)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Windows, stocks]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30   # 빌드 도장(git log)과 릴리스 노트용

      # 서비스로 도는 러너는 .path 를 읽지 않아 bash·gradle 을 못 찾는다("bash: command not found").
      # 서비스 재시작엔 관리자 권한이 필요하므로 여기서 PATH 에 직접 넣는다. 이 단계만 powershell.
      # ascii 로 쓴다 — PS 5.1 의 utf8 은 BOM 을 붙여 첫 경로가 깨진다.
      - name: PATH
        shell: powershell
        run: |
          "C:\Program Files\Git\bin", "C:\Program Files\Git\usr\bin",
          "C:\Users\yoonh\android-build\jdk-17.0.20.1+1\bin",
          "C:\Users\yoonh\android-build\gradle-8.9\bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      - name: Toolchain
        run: |
          java -version 2>&1 | head -1
          gradle --version | grep -E "^Gradle"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      # 토스증권 연동판 — android/ 를 복사해 만든 별도 앱 (applicationId 가 달라 나란히 설치 가능)
      # version.json 도 같이 만든다 — 폰이 이걸 보고 스스로 업데이트한다(AppUpdate.kt)
      - name: Build debug APK (toss)
        working-directory: android-toss
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          [ -n "$NOTES" ] || NOTES="$(git log -1 --format=%s)"
          gradle assembleDebug versionJson -PreleaseNotes="$NOTES" --stacktrace

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp android-toss/app/build/outputs/apk/debug/app-debug.apk quant-toss-debug.apk
          cp android-toss/app/build/outputs/version.json version.json
          ls -la *.apk version.json && cat version.json

      - name: Release notes
        if: github.ref == 'refs/heads/main' && inputs.publish
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "갤럭시에서 이 APK를 받아 설치하세요 (출처 불명 앱 설치 허용 필요)."
            echo
            echo "- \`quant-toss-debug.apk\` — 토스증권 연동판 (주력)"
            echo "- \`app-debug.apk\` — 기존 앱 (퀀트 대시보드)"
            echo
            echo "빌드: $(git log -1 --format='%cd %h' --date=format:'%m-%d %H:%M')"
            echo
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "### 최근 변경"
              git log -15 --format='- %s'
            fi
          } > release-notes.md

      - name: Publish to rolling release
        if: github.ref == 'refs/heads/main' && inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Android 최신 빌드 (debug)"
          prerelease: true
          body_path: release-notes.md
          files: |
            app-debug.apk
            quant-toss-debug.apk
            version.json
